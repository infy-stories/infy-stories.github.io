<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story rules | Infy Stories</title>
  <script>
    const ref = document.referrer.toLowerCase();
    const isFromIndex = ref.includes('index') || ref.endsWith('/');
    let fromStoryLink = false;
    try {
      const created = Number(sessionStorage.getItem('storyRulesEntry'));
      fromStoryLink = created > 0 && Date.now() - created >= 0 && Date.now() - created <= 300000;
    } catch {}
    const permittedRefresh = ['reload', 'back_forward'].includes(performance.getEntriesByType('navigation')[0]?.type)
      && history.state?.storyRulesAllowed;
    window.location.replace(fromStoryLink || permittedRefresh || (ref && isFromIndex)
      ? 'writeStoryRules.html' : 'index.html');
  </script>
</head>
<body>
  <p>The story rules have moved. <a href="writeStoryRules.html">Continue to the story rules</a>.</p>
</body>
</html>
